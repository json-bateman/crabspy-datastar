version: '3'

tasks: 
  sqlc:
    cmds:
      - sqlc generate
    sources:
      - sql/queries/*.sql
      - sqlc.yaml
    generates:
      - sql/sqlcgen/*.go

  templ:watch:
    desc: Watch templ files and regenerate
    cmd: templ generate --watch

  go:watch:
    desc: Watch Go files and restart server
    cmd: air

  templ:build:
    desc: Generate templ files
    cmd: templ generate
  go:build:
    desc: Build for production
    deps: [templ:build, sqlc]
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
    cmds:
      - mkdir -p ./release
      - go build -ldflags "-X 'crabspy/web.Commit={{.COMMIT}}'" -o ./release/watchma ./cmd/main.go
      - echo "Release built in ./release/"

  clean:
    desc: Clean build artifacts (including database)
    cmds:
      - rm -rf ./tmp
      - rm -rf ./release
      - find . -name "*_templ.go" -delete
      - rm -rf ./data

  default:
    desc: Run and watch with air
    deps: [sqlc]
    cmds:
      - air



